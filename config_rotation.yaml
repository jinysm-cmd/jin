# 코인 순환매(롱숏 모멘텀) 설정 - momentum_lab.py [B] 공정 테스트에서
# '롱숏 L14 보유14일 상위5' : 3년 +239%, 최대낙폭 -30%, 앞·뒤 기간 모두 플러스

lookback_days: 14        # 지난 14일 수익률로 순위
hold_days: 14            # 14일마다 교체
top_k: 5                 # 상위 5개 롱 + 하위 5개 숏
universe_size: 30        # 최근 30일 평균 거래대금 상위 30개 안에서만 고름
min_age_days: 60         # 상장 60일 미만 코인 제외
min_quote_volume: 5000000

exposure: 1.0            # 총 포지션 금액 = 운용자금 x 1 (롱 50% + 숏 50%). 백테스트와 같은 값
leverage: 3              # 거래소 레버리지 설정 (증거금 여유용, 노출은 위 exposure 로 정해짐)
catastrophe_stop: 0.30   # 진입가 대비 30% 반대로 가면 거래소 비상손절 (숏 스퀴즈 대비)

capital_usdt: 150        # live 에서 이 봇이 쓸 금액. 0 이면 계좌 전체. 처음엔 작게!
paper_start_equity: 350  # 모의 계좌 시작 금액
