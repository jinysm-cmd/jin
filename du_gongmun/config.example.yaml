# 이 파일을 config.yaml 로 복사해서 채우세요.  (cp config.example.yaml config.yaml)
# 비밀번호는 여기에 쓰지 않습니다 → setup_secrets.py 로 키체인에 저장.

# 포털 로그인 화면 주소 (브라우저 주소창에서 복사)
login_url: "https://portal.du.ac.kr/"
username: "아이디"

# 로그인 칸을 자동으로 못 찾을 때만 채우세요 (CSS 선택자)
# selectors:
#   username: "#userId"
#   password: "#userPw"
#   submit: "#btnLogin"

# 로그인 후 읽을 화면들. 위에서부터 순서대로.
#   url:   그 화면 주소를 바로 열기 (로그인 후 주소창에서 복사)
#   click: 로그인 직후 화면에서 차례로 누를 메뉴 글자
# 둘 중 하나만 써도 되고, url로 연 뒤 click을 이어서 해도 됩니다.
# 우리 학과 — 이 학과와 관련 없는 공문은 뺍니다
department: "실용음악학과"
keywords: ["실용음악", "음악", "예술", "공연", "보컬", "작곡", "연주", "실기", "콘서트",
           "음원", "저작권", "오디션", "문화", "콘텐츠"]
# 예술 분야가 아니어도 남길 학과 운영 주제 (전 학과 해당 공문)
topics: ["졸업", "특강", "캡스톤", "교육과정", "교과목", "수업", "강의", "시간표", "성적", "출석",
         "학사", "휴학", "복학", "학생지도", "상담", "취업", "현장실습", "산학", "인턴", "장학",
         "입시", "신입생", "모집", "전공", "학과", "교원", "교수", "연수", "강의평가", "비교과",
         "역량", "포트폴리오", "공모전", "경진대회", "LINC", "RISE", "혁신지원", "학습",
         "학생", "행사", "축제", "평가", "인증", "실험실습", "기자재",
         "교수학습", "학습지침", "강의지침", "교육지침", "지침 개발", "회의", "전체회의", "교수회의",
         "교직원", "워크숍", "설명회", "간담회", "위원회", "세미나", "설문", "의견수렴", "학칙"]
# 공람함은 내 앞으로 온 공문이라 기본은 모두 남기고, 제목에 이런 말이 있으면 뺍니다
skip_words: ["인사발령", "직제개편", "모금", "성금", "헌혈", "부고", "조의", "홍보비 집행",
             "법인카드", "회계 마감", "계약 체결", "청사", "보수공사", "주차"]

pages:
  # 로그인 직후 첫 화면의 '나의현황' 숫자 (url/click 없음 = 첫 화면 그대로)
  - name: 포털 현황
    counts: ["결재대기", "수/발신대기", "공람대기"]
  # 공람대기 목록: 지난 브리핑 이후 들어온 공문만 골라 본문까지 읽음
  - name: 공람대기
    click: ["그룹웨어", "공람 대기함"]   # 그룹웨어 왼쪽 메뉴의 '공람 대기함'
    list: true
    # open_items: false   # 본문을 열지 않고 제목만 보고 정리 (열면 그룹웨어에 '확인' 처리될 수 있음)
    wait_ms: 3000
    max_pages: 5      # 목록 몇 쪽까지 넘겨볼지
    max_items: 40     # 하루 최대 몇 건 읽을지

# ── 어떻게 정리할지 (모두 무료가 기본) ──
#   auto       맥에 Claude Code(claude 명령)가 설치·로그인돼 있으면 그걸로 똑똑하게 정리
#              (Claude 구독에 포함 → 추가 요금 없음), 없으면 rules 방식
#   rules      AI 없이 날짜와 '제출·회신·까지' 같은 단어로 정리 (완전 무료)
#   api        Claude API 키 사용 (유료)
summarizer: auto
# claude 명령을 못 찾으면 위치 지정 (터미널에서 `which claude` 로 확인)
# claude_path: "~/.local/bin/claude"

# ── 어디로 받을지 (여러 개 가능, 모두 무료) ──
#   mac       맥 화면 오른쪽 위 알림 + 브리핑 파일이 자동으로 열림
#   email     지메일로 나에게 보내기 → 갤럭시 Gmail 앱 알림으로 출근길에 확인 (구글 앱 비밀번호 필요)
#   kakao     카카오톡 나에게 보내기 (무료, 카카오 개발자 앱 설정 필요)
#   imessage  아이폰 사용자용
delivery: ["mac", "kakao"]

# (메일로도 받을 때만) email_to: "내주소@gmail.com"
# (아이폰일 때만) imessage_to: "+8210xxxxxxxx"

# 브리핑 파일을 아침에 자동으로 열지
open_file: true

# 전체 브리핑 저장 위치
output_dir: "~/Documents/공문브리핑"

# 사이트가 자동 브라우저를 막으면: browser_channel: "chrome" (설치된 크롬 사용)
headless: true
# browser_channel: "chrome"

# 카톡 메시지의 '포털 열기' 버튼 주소, 최대 메시지 수(200자씩 나눠 보냄)
link_url: "https://portal.du.ac.kr/"
max_kakao_messages: 15
